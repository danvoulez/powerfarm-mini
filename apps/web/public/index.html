<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Powerfarm</title>
  <meta name="description" content="Powerfarm institutional research and execution platform">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">PF</div>
        <div><strong>Powerfarm</strong><span>Platform v0</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="connection" class="connection"><span></span> Connecting</div>
        <button id="token-button" class="ghost-button">Access token</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div id="eyebrow" class="eyebrow">POWERFARM</div>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="top-actions">
          <button id="refresh-button" class="secondary-button">Refresh</button>
        </div>
      </header>
      <section id="app" class="content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="token-dialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><h2>API access</h2><button value="cancel" class="icon-button" aria-label="Close">×</button></div>
      <p>The local development token is stored only in this browser.</p>
      <label>Bearer token<input id="token-input" type="password" autocomplete="off" spellcheck="false"></label>
      <div class="dialog-actions"><button value="cancel" class="secondary-button">Cancel</button><button id="save-token" value="default" class="primary-button">Save</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
